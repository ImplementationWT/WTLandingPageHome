<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<style>
  :root{
    --ink:#0A0E1A; --side:#0B1020; --hair:rgba(255,255,255,.08);
    --coral:#FF3054; --coral-soft:rgba(255,48,84,.5); --hi:#F2F4F8; --lo:#8A93A6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);font-family:Inter,system-ui,sans-serif;color:var(--hi)}
  .app{display:flex;height:100%;width:100%}
  .sidebar{width:300px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--hair)}
  .map-wrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0;background:var(--ink)}
  .leaflet-container{background:var(--ink);font-family:Inter,sans-serif}
  .leaflet-tile-pane{filter:brightness(.9) contrast(1.05)}
  body.fallback .leaflet-tile-pane{filter:invert(1) grayscale(.92) brightness(.95) contrast(.9)}

  .pin{position:relative;width:14px;height:14px}
  .pin .dot{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#FF8398,var(--coral));
    box-shadow:0 0 0 2px rgba(10,14,26,.9), 0 0 10px 2px var(--coral-soft);
    transition:transform .18s ease, box-shadow .18s ease}
  .pin:hover .dot{transform:scale(1.45);box-shadow:0 0 0 2px rgba(10,14,26,.9),0 0 16px 5px var(--coral-soft)}
  .pin.is-active .dot{transform:scale(1.55);box-shadow:0 0 0 2px rgba(10,14,26,.95),0 0 22px 7px var(--coral-soft)}

  .leaflet-tooltip.name-tip{background:#12182a;color:var(--hi);border:1px solid var(--hair);
    border-radius:7px;padding:5px 9px;font-weight:600;font-size:12.5px;letter-spacing:.2px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
  .leaflet-tooltip.name-tip:before{display:none}
  .leaflet-popup-content-wrapper{background:#0E1322;border:1px solid var(--hair);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .leaflet-popup-tip{background:#0E1322;border:1px solid var(--hair)}
  .leaflet-popup-content{margin:13px 15px;font-family:Inter,sans-serif}
  .pp-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--hi);margin-bottom:3px}
  .pp-addr{font-size:12.5px;color:var(--lo);line-height:1.45}
  .pp-flag{display:inline-block;margin-top:8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);border-top:1px solid var(--hair);padding-top:7px}
  .leaflet-popup-close-button{color:var(--lo)!important}

  .head{padding:20px 20px 16px;border-bottom:1px solid var(--hair)}
  .eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--coral);font-weight:600}
  .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:23px;letter-spacing:-.01em;margin:6px 0 12px}
  .stats{display:flex;gap:18px}
  .stat .n{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px}
  .stat .l{font-size:11px;color:var(--lo);letter-spacing:.04em}
  .search{position:relative;padding:14px 20px}
  .search input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:10px;
    padding:10px 12px 10px 34px;color:var(--hi);font-size:13px;font-family:Inter,sans-serif;outline:none;transition:border .15s}
  .search input::placeholder{color:var(--lo)}
  .search input:focus{border-color:var(--coral-soft)}
  .search svg{position:absolute;left:31px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--lo);fill:none}

  .acc{flex:1;overflow:auto;border-top:1px solid var(--hair)}
  details{border-bottom:1px solid rgba(255,255,255,.05)}
  details.state{border-bottom:1px solid rgba(255,255,255,.035)}
  summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:12px 18px;transition:background .12s}
  summary::-webkit-details-marker{display:none}
  summary:hover{background:rgba(255,255,255,.03)}
  .chev{flex:none;width:7px;height:7px;border-right:1.6px solid var(--lo);border-bottom:1.6px solid var(--lo);
    transform:rotate(-45deg);transition:transform .15s}
  details[open]>summary .chev{transform:rotate(45deg)}
  .country>summary .nm{font-size:13.5px;font-weight:600;color:var(--hi);flex:1}
  .state>summary{padding-left:30px}
  .state>summary .nm{font-size:12.5px;font-weight:500;color:var(--hi);flex:1}
  .badge{flex:none;min-width:23px;height:21px;padding:0 7px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,48,84,.13);color:#FF7E96;font-size:11px;font-weight:600;font-family:'Space Grotesk',sans-serif}
  .cl{padding:9px 20px 9px 47px;font-size:12.5px;color:var(--lo);cursor:pointer;transition:background .12s,color .12s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cl:hover{background:rgba(255,48,84,.10);color:var(--hi)}
  .empty{padding:16px 20px;color:var(--lo);font-size:12.5px}
  .acc::-webkit-scrollbar{width:9px}
  .acc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  .credit{position:absolute;bottom:8px;right:10px;z-index:500;font-size:10.5px;color:var(--lo);opacity:.7}

  @media (max-width:820px){
    .app{flex-direction:column}
    .sidebar{width:auto;flex:none;max-height:52vh;border-right:none;border-bottom:1px solid var(--hair)}
    .map-wrap{flex:1;min-height:320px}
    /* single column — one country open at a time, its cities listed beneath it */
    .acc{display:block}
    details.country{border-bottom:1px solid rgba(255,255,255,.07)}
    .country>summary{padding:12px 16px}
    .country>summary .nm{font-size:13px}
  }
  @media (prefers-reduced-motion:reduce){ .pin .dot{transition:none} }

  /* Custom cursor inside the map iframe — matches the site (red dot + ring + echo) */
  @media (hover:hover) and (pointer:fine){
    *,*::before,*::after{cursor:none !important}
    .cur-dot,.cur-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:99999;will-change:transform}
    .cur-dot{width:7px;height:7px;background:var(--coral);margin:-3.5px 0 0 -3.5px;box-shadow:0 0 8px rgba(255,48,84,.8);transition:opacity .25s}
    .cur-ring{width:34px;height:34px;border:1.5px solid rgba(255,48,84,.55);margin:-17px 0 0 -17px;transition:opacity .25s}
    .cur-echo{position:fixed;top:0;left:0;border-radius:50%;border:1.5px solid var(--coral);pointer-events:none;z-index:99998}
    .cur-dot.is-hidden,.cur-ring.is-hidden{opacity:0}
  }
  @media (hover:none),(pointer:coarse){ .cur-dot,.cur-ring,.cur-echo{display:none} }
</style>

const map = L.map('map',{zoomControl:false,worldCopyJump:true,minZoom:2,maxZoom:18}).setView([28,-30], 3);
L.control.zoom({position:'bottomright'}).addTo(map);

// CARTO basemaps now require an API key (returns an "API KEY REQUIRED" tile), so use Esri's keyless dark canvas
const base = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles &copy; Esri', maxNativeZoom:16, maxZoom:18
}).addTo(map);
let switched=false, tileErrs=0;
base.on('tileerror', ()=>{
  if(switched) return;
  if(++tileErrs >= 3){
    switched=true; map.removeLayer(base); document.body.classList.add('fallback');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'',subdomains:'abc',maxZoom:19}).addTo(map);
  }
});

const icon = L.divIcon({className:'', html:'<div class="pin"><div class="dot"></div></div>',
  iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8], tooltipAnchor:[0,-6]});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const markers = [], bounds = [];

PINS.forEach((p)=>{
  const m = L.marker([p.lat,p.lng],{icon, riseOnHover:true}).addTo(map);
  m.bindTooltip(esc(p.client),{className:'name-tip',direction:'top',offset:[0,-4]});
  m.bindPopup('<div class="pp-name">'+esc(p.client)+'</div>'+
              '<div class="pp-addr">'+esc(p.address)+'</div>'+
              '<div class="pp-flag">'+esc(p.city)+' &middot; '+esc(p.country)+'</div>');
  p._m = m; markers.push(m); bounds.push([p.lat,p.lng]);
});
if(bounds.length) map.fitBounds(bounds,{padding:[60,60],maxZoom:5});

function clearActive(){ markers.forEach(mk=>{ const e=mk._icon&&mk._icon.querySelector('.pin'); if(e) e.classList.remove('is-active'); }); }
function flyToClient(i){
  clearActive();
  const p = PINS[i];
  map.flyTo([p.lat,p.lng], 6, {duration:.9});
  p._m.openPopup();
  const e = p._m._icon && p._m._icon.querySelector('.pin'); if(e) e.classList.add('is-active');
}

const accEl = document.getElementById('acc'), qEl = document.getElementById('q');
function build(filter){
  const f = filter.trim().toLowerCase();
  let html = '', any = false;
  TREE.forEach(co=>{
    const coHit = co.c.toLowerCase().includes(f);
    let states = '', coCount = 0;
    co.s.forEach(st=>{
      const stHit = coHit || st.n.toLowerCase().includes(f);
      const clients = st.cl.filter(c => !f || stHit || c.n.toLowerCase().includes(f));
      if(!clients.length) return;
      coCount += clients.length;
      const open = f ? ' open' : '';
      states += '<details class="state"'+open+'><summary><span class="chev"></span>'+
        '<span class="nm">'+esc(st.n)+'</span><span class="badge">'+clients.length+'</span></summary>'+
        clients.map(c=>'<div class="cl" data-i="'+c.i+'">'+esc(c.n)+'</div>').join('')+'</details>';
    });
    if(!states) return;
    any = true;
    const open = f ? ' open' : '';
    html += '<details class="country"'+open+'><summary><span class="chev"></span>'+
      '<span class="nm">'+esc(co.c)+'</span><span class="badge">'+coCount+'</span></summary>'+states+'</details>';
  });
  accEl.innerHTML = any ? html : '<div class="empty">Nada coincide con &ldquo;'+esc(filter)+'&rdquo;.</div>';
  accEl.classList.toggle('searching', !!f);
}
accEl.addEventListener('click',e=>{ const r=e.target.closest('.cl'); if(r) flyToClient(+r.dataset.i); });
// one country open at a time — close siblings so only the selected country shows its cities
accEl.addEventListener('toggle', function(e){
  const d = e.target;
  if (d.classList && d.classList.contains('country') && d.open){
    accEl.querySelectorAll('details.country[open]').forEach(function(o){ if(o!==d) o.open=false; });
  }
}, true);
qEl.addEventListener('input',()=>build(qEl.value));
build('');

setTimeout(()=>map.invalidateSize(),60);
window.addEventListener('resize',()=>map.invalidateSize());
</script>

<script>
(function(){
  if(!window.matchMedia||!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  var dot=document.createElement('div');dot.className='cur-dot';
  var ring=document.createElement('div');ring.className='cur-ring';
  document.body.appendChild(dot);document.body.appendChild(ring);
  var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my,lastEcho=0;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.transform='translate('+mx+'px,'+my+'px)';},{passive:true});
  function spawnEcho(){
    var ec=document.createElement('div');ec.className='cur-echo';
    ec.style.left=mx+'px';ec.style.top=my+'px';ec.style.width='10px';ec.style.height='10px';ec.style.margin='-5px 0 0 -5px';ec.style.opacity='0.55';ec.style.transition='all .9s ease-out';
    document.body.appendChild(ec);
    requestAnimationFrame(function(){ec.style.width='58px';ec.style.height='58px';ec.style.margin='-29px 0 0 -29px';ec.style.opacity='0';});
    setTimeout(function(){ec.remove();},920);
  }
  function loop(){
    rx+=(mx-rx)*0.18;ry+=(my-ry)*0.18;
    ring.style.transform='translate('+rx+'px,'+ry+'px)';
    var now=performance.now();
    if(now-lastEcho>600){lastEcho=now;spawnEcho();}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.addEventListener('mouseleave',function(){dot.classList.add('is-hidden');ring.classList.add('is-hidden');});
  document.addEventListener('mouseenter',function(){dot.classList.remove('is-hidden');ring.classList.remove('is-hidden');});
})();
</script>
